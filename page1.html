<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 이미지 관리</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        
        <div class="p-3">
            <button class="btn-primary w-100" onclick="openAddPopup()">+ 이미지 추가</button>
        </div>

        <div class="sidebar-menu">
            <div class="menu-item active" onclick="goPage('page1.html')"><i>🖼️</i> <span>정품 이미지 저장</span></div>
            <div class="menu-item" onclick="goPage('page2.html')"><i>📊</i> <span>데이터 관리</span></div>
            <div class="menu-item" onclick="showSection('upload')"><i>📤</i> <span>파일 업로드</span></div>
            <div class="menu-item" onclick="showSection('settings')"><i>⚙️</i> <span>설정</span></div>
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;"><i>🚪</i> <span>로그아웃</span></div>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <div class="main-content">
        <div id="dashboard" class="content-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px;">
                <div style="display: flex; gap: 8px; align-items: center; flex: 1;">
                    <select id="sortSelect" onchange="fetchImages()" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
                        <option value="desc">최신순</option>
                        <option value="asc">과거순</option>
                    </select>
                    <input type="text" id="tagFilter" placeholder="태그로 검색 (엔터)" onkeypress="if(event.keyCode==13) fetchImages()" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; width: 200px;">
                    <button onclick="resetAllFilters()" style="padding: 8px 12px; background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer; font-size: 13px;">초기화</button>
                </div>
            
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button id="editModeBtn" onclick="toggleEditMode()" style="padding: 0 15px; height: 35px; background: #edf2f7; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 13px;">✏️ 수정</button>
            
                    <div id="editModeControls" style="display: none; gap: 8px; align-items: center; border-left: 2px solid #edf2f7; padding-left: 10px; margin-left: 5px;">
                        <button id="selectAllBtn" onclick="toggleSelectAll()" style="height: 35px; padding: 0 12px; background:#f8fafc; border:1px solid #cbd5e0; border-radius:6px; font-size:13px; cursor:pointer;">전체 선택</button>
                        <span id="selectCountDisplay" style="font-size: 13px; font-weight: bold; color: #4a5568; white-space: nowrap;">0개 선택됨</span>
                        
                        <button id="bulkEditBtn" onclick="openBulkTagModal()" style="padding: 0 15px; height: 35px; background: #4a5568; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;">🏷️ 태그 편집</button>
                        <button id="deleteBtn" onclick="deleteSelectedImages()" style="padding: 0 15px; height: 35px; background:#e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">🗑️ 삭제</button>
                    </div>
                </div>
            </div>
            
            <div id="filterContainer" style="display: flex; align-items: stretch; padding: 0; background: white; border-radius: 10px; margin-bottom: 25px; border: 1px solid #2c3e50; overflow: hidden; height: 80px;">
                <div style="width: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border-right: 1px solid #bee3f8; padding: 5px; background: #f8fafc;">
                    <div style="display: flex; gap: 4px;">
                        <button id="btn-AND" onclick="setMode('AND')" class="filter-mode-btn">AND</button>
                        <button id="btn-OR" onclick="setMode('OR')" class="filter-mode-btn active-or">OR</button>
                    </div>
                    <button id="btn-DEL" onclick="toggleDel()" class="filter-mode-btn" style="width: 50px; padding: 4px; font-size: 11px;">DEL</button>
                </div>
                <div id="savedTermsList" style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px 20px; flex-wrap: wrap; overflow-y: auto;"></div>
                <div style="width: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border-left: 1px solid #bee3f8; padding: 5px; background: #f8fafc;">
                    <button onclick="editSavedTerms()" style="padding: 2px 8px; font-size: 11px; background: white; border: 1px solid #cbd5e0; border-radius: 4px; cursor: pointer;">편집</button>
                    <button onclick="fetchImages()" style="padding: 8px 15px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">검색</button>
                </div>
            </div>
            <div id="imageGrid"></div>
        </div>

        <div id="upload" class="content-section">
            <h2 style="margin-bottom: 20px;">📤 파일 업로드 (Excel/CSV)</h2>
            </div>

        <div id="settings" class="content-section">
            <h2>설정</h2>
        </div>
    </div>

    <div id="imageModal" class="modal">
        </div>

    <div id="editModal" class="modal">
        </div>

    <script src="config.js"></script>
    <script src="auth-image-logic.js"></script>
    <script>
        // 파라미터 유지를 위한 페이지 이동 함수
        function goPage(page) {
            location.href = page + "?table=" + tableName;
        }

        window.onload = () => {
            if (typeof renderSavedTerms === 'function') renderSavedTerms();
            // URL 해시값에 따라 섹션 표시
            const hash = window.location.hash.replace('#', '');
            showSection(hash || 'dashboard');
            if (typeof fetchImages === 'function') fetchImages();
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            const sec = document.getElementById(sectionId);
            if(sec) sec.classList.add('active');
            
            // 메뉴 활성화 시각화 로직 추가 가능
        }
    </script>
</body>
</html>
