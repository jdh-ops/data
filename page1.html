<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 데이터 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* [기존 스타일 유지] */
        :root { 
            --sidebar-width: 260px; 
            --sidebar-collapsed-width: 70px; 
            --primary-color: #3498db; 
            --bg-color: #f8f9fa; 
        }
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-color); color: #333; }
        
        /* 사이드바 애니메이션 및 스타일 */
        .sidebar { 
            width: var(--sidebar-width); background: #2c3e50; color: white; display: flex; flex-direction: column; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.1); transition: width 0.3s ease; position: relative; overflow: hidden;
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
        .sidebar.collapsed .sidebar-header,
        .sidebar.collapsed .menu-item span { display: none; }
        .sidebar.collapsed .menu-item { justify-content: center; padding: 15px 0; }

        .sidebar-header { padding: 30px 20px; font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid #3e4f5f; text-align: center; color: #ecf0f1; }
        .sidebar-menu { flex: 1; padding: 20px 0; }
        .menu-item { padding: 15px 25px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; font-size: 15px; gap: 10px; }
        .menu-item:hover { background: #34495e; }
        .menu-item.active { background: var(--primary-color); color: white; border-right: 5px solid #fff; }

        /* 메인 콘텐츠 */
        .main-content { flex: 1; overflow-y: auto; padding: 40px; transition: 0.3s; }
        .content-section { display: none; }
        .content-section.active { display: block; animation: fadeIn 0.4s ease-out; }

        /* 필터 및 버튼 스타일 */
        .filter-mode-btn { padding: 8px 15px; border-radius: 6px; border: 1px solid #cbd5e0; background: #edf2f7; cursor: pointer; font-weight: bold; color: #4a5568; transition: 0.2s; }
        .active-and { background: #38a169 !important; color: white !important; border-color: #38a169 !important; }
        .active-or { background: #3182ce !important; color: white !important; border-color: #3182ce !important; }
        
        .btn-primary { padding: 12px 25px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-select { padding: 8px 15px; background: #edf2f7; border: 1px solid #e2e8f0; border-radius: 5px; cursor: pointer; }
        
        .toggle-btn { position: absolute; bottom: 20px; right: 20px; background: #34495e; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 18px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        
        <div class="sidebar-menu">
            <div class="menu-item active" onclick="showSection('dashboard')">
                <i>🖼️</i> <span>정품 이미지 저장</span>
            </div>
            <div class="menu-item" onclick="showSection('upload')">
                <i>📤</i> <span>파일 업로드</span>
            </div>
            <div class="menu-item" onclick="showSection('settings')">
                <i>⚙️</i> <span>설정</span>
            </div>
            
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;">
                <i>🚪</i> <span>로그아웃</span>
            </div>
        </div>
    
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <div class="main-content">
        <div id="dashboard" class="content-section active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px;">
                <div style="display: flex; gap: 8px; align-items: center; flex: 1;">
                    <select id="sortSelect" onchange="fetchImages()" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
                        <option value="desc">최신순</option>
                        <option value="asc">과거순</option>
                    </select>
                    <input type="text" id="tagFilter" placeholder="태그로 검색 (엔터)" 
                           onkeypress="if(event.keyCode==13) fetchImages()" 
                           style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; width: 200px;">
                    <button onclick="resetSearch()" style="padding: 8px 12px; background: #f8fafc; border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer; font-size: 13px;">초기화</button>
                </div>
                
                <div style="display: flex; gap: 8px;">
                    <button onclick="openAddPopup()" style="padding: 0 15px; height: 35px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 16px;">+</span> 이미지 추가
                    </button>
                    <button id="editModeBtn" onclick="toggleEditMode()" style="padding: 0 15px; height: 35px; background: #edf2f7; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 13px; color: #4a5568; display: flex; align-items: center; gap: 5px;">
                        ✏️ 수정
                    </button>
                    <button id="deleteBtn" onclick="deleteSelectedImages()" style="display:none; padding: 0 15px; height: 35px; background:#e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">
                        🗑️ 삭제
                    </button>
                </div>
            </div>
            
            <div id="filterContainer" style="display: flex; align-items: stretch; padding: 0; background: white; border-radius: 10px; margin-bottom: 25px; border: 1px solid #2c3e50; overflow: hidden; height: 80px;">
                
                <div style="width: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border-right: 1px solid #bee3f8; padding: 5px; background: #f8fafc;">
                    <div style="display: flex; gap: 4px;">
                        <button id="btn-AND" onclick="setMode('AND')" class="filter-mode-btn" style="padding: 4px 8px; font-size: 11px;">AND</button>
                        <button id="btn-OR" onclick="setMode('OR')" class="filter-mode-btn active-or" style="padding: 4px 8px; font-size: 11px;">OR</button>
                    </div>
                    <button id="btn-DEL" onclick="toggleDel()" class="filter-mode-btn" style="width: 50px; padding: 4px; font-size: 11px;">DEL</button>
                </div>
            
                <div id="savedTermsList" style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px 20px; flex-wrap: wrap; overflow-y: auto;">
                    </div>
            
                <div style="width: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border-left: 1px solid #bee3f8; padding: 5px; background: #f8fafc;">
                    <button onclick="editSavedTerms()" style="padding: 2px 8px; font-size: 11px; background: white; border: 1px solid #cbd5e0; border-radius: 4px; cursor: pointer; color: #718096;">편집</button>
                    <button onclick="fetchImages()" style="padding: 8px 15px; background: #2c3e50; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;">검색</button>
                </div>
            </div>
        
            <div id="imageGrid"></div>
        </div>

        </div>

    <script src="config.js"></script>
    <script src="keyword-logic.js"></script>
    <script src="upload-logic.js"></script>
    <script src="auth-image-logic.js"></script>

    <script>
        window.onload = () => {
            initKeywordView();
            // 필터 UI 초기화 (버튼 렌더링)
            if (typeof renderSavedTerms === 'function') renderSavedTerms();
            
            // 섹션 로드
            if (window.location.hash === '#upload') {
                showSection('upload');
            } else {
                showSection('dashboard');
                fetchImages(); // 초기 데이터 로드 호출
            }
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.toggle-btn');
            sidebar.classList.toggle('collapsed');
            toggleBtn.innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            // 메뉴 하이라이트 (아이콘 텍스트 기준 매칭)
            const menuIdx = { 'dashboard': 0, 'upload': 1, 'settings': 2 };
            document.querySelectorAll('.menu-item')[menuIdx[sectionId]].classList.add('active');
        }
    </script>
</body>
</html>
