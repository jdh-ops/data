<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 데이터 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .edit-mode-active {
            outline: 3px solid var(--primary-color) !important;
            background-color: #fffcf0 !important;
        }
        .edit-mode-active td { cursor: cell; }
        .table-responsive {
            max-height: calc(100vh - 250px);
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="handleMenuClick('dashboard')"><i>🖼️</i> <span>정품 이미지 저장</span></div>
            <div class="menu-item active" onclick="goPage('page2.html')"><i>📊</i> <span>데이터 관리</span></div>
            <div class="menu-item" onclick="handleMenuClick('upload')"><i>📤</i> <span>파일 업로드</span></div>
            <div class="menu-item" onclick="handleMenuClick('settings')"><i>⚙️</i> <span>설정</span></div>
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;"><i>🚪</i> <span>로그아웃</span></div>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <div class="main-content">
        <h2 class="fw-bold mb-4">📊 데이터 관리</h2>
    
        <div class="top-controls" style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; align-items: center;">
            <div class="search-group" style="display: flex; gap: 8px; flex: 1; min-width: 300px;">
                <input type="text" id="tableSearchInput" class="search-input" placeholder="검색어를 입력하세요..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px;" onkeyup="filterTable()">
                <button class="btn-select" onclick="resetTableFilter()">초기화</button>
            </div>
            <div class="button-group" style="display: flex; gap: 8px;">
                <button id="editModeToggle" class="btn-select" onclick="toggleEditMode()">✏️ 수정하기</button>
                <button class="btn-primary" onclick="openExcelUploadModal()">📤 엑셀 업로드</button> 
            </div>
        </div>
    
        <div id="editModeBar" style="display: none; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: #fffcf0; border: 1px solid #fbd38d; border-radius: 8px;">
            <div class="left-btns">
                <button class="btn-select" onclick="selectAllRows(true)">전체 선택</button>
                <button class="btn-select" onclick="selectAllRows(false)">전체 취소</button>
            </div>
            <div class="right-btns" style="display: flex; gap: 8px;">
                <button class="btn-select" onclick="openColumnManagementModal()">⚙️ 열 설정</button>
                <button class="btn-select" onclick="addNewRow()">➕ 행 추가</button>
                <button class="btn-select" style="color: red; border-color: #feb2b2;" onclick="deleteSelectedRows()">🗑️ 삭제</button>
            </div>
        </div>
    
        <div class="card shadow-sm" style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee;">
            <div id="dataManagerContainer" class="table-responsive"></div>
        </div>
    </div>
    
    <div id="excelUploadModal" class="modal">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 20px;">
                <h5 class="modal-title" style="margin: 0; font-weight: bold; font-size: 1.1rem;">📤 엑셀 데이터 업로드</h5>
                <button type="button" onclick="closeExcelModal()" 
                        style="border: none; background: none; cursor: pointer; font-size: 24px; color: #a0aec0; line-height: 1; padding: 0; margin: 0;"
                        onmouseover="this.style.color='#4a5568'" 
                        onmouseout="this.style.color='#a0aec0'">
                    ✕
                </button>
            </div>
            
            <div class="modal-body" style="padding: 20px 0;">
                <div style="margin-bottom: 20px; text-align: right;">
                    <button class="btn-select" onclick="downloadExcelTemplate()" style="font-size: 12px; background: #f8fafc;">📄 템플릿 양식 다운로드</button>
                </div>
                
                <div id="excelDropZone" style="border: 2px dashed #cbd5e0; border-radius: 12px; padding: 40px 20px; text-align: center; background: #f8fafc; cursor: pointer;" onclick="document.getElementById('excelFileInput').click()" ondragover="handleExcelDragOver(event)" ondragleave="handleExcelDragLeave(event)" ondrop="handleExcelDrop(event)">
                    <div style="font-size: 30px; margin-bottom: 10px;">📊</div>
                    <p id="excelDropText" style="color: #718096; margin-bottom: 0;">파일을 이 곳으로 드래그하거나 클릭하여 선택하세요.</p>
                    <input type="file" id="excelFileInput" hidden accept=".xlsx, .xls" onchange="handleExcelSelect(event)">
                </div>
    
                <div style="margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #eee; border-radius: 8px;">
                    <p style="font-weight: bold; font-size: 14px; margin-bottom: 10px;">⚙️ 업로드 방식 선택</p>
                    <div style="display: flex; gap: 20px; font-size: 13px;">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 5px;"><input type="radio" name="uploadMode" value="append" checked> 기존 데이터에 추가</label>
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 5px; color: #e74c3c;"><input type="radio" name="uploadMode" value="overwrite"> 기존 데이터 대체</label>
                    </div>
                    <p id="overwriteWarning" style="display: none; color: #e74c3c; font-size: 11px; margin-top: 8px;">⚠️ 주의: '대체' 선택 시 현재 프로젝트의 모든 데이터가 삭제됩니다.</p>
                </div>
                <p id="excelFileName" style="margin-top: 10px; font-weight: bold; color: var(--primary-color); text-align: center;"></p>
            </div>
    
            <div class="modal-footer" style="border-top: 1px solid #eee; padding-top: 15px; display: flex; gap: 10px;">
                <button id="startExcelUploadBtn" class="btn-primary" style="flex: 1;" onclick="processExcelUpload()" disabled>업로드 시작</button>
                <button class="btn-select" style="flex: 1;" onclick="closeExcelModal()">취소</button>
            </div>
        </div>
    </div>

    <div id="commonModal" class="modal">
        <div class="modal-content" style="width: 500px; max-height: 80vh; overflow-y: auto;"></div>
    </div>

    <script src="config.js"></script>
    <script src="datamng.js"></script>

    <script>
        function goPage(page) {
            window.location.href = page + window.location.search;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            document.querySelector('.toggle-btn').innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        function showModal(contentHtml) {
            const modal = document.getElementById('commonModal');
            modal.querySelector('.modal-content').innerHTML = contentHtml;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('commonModal').style.display = 'none';
        }

        function openExcelUploadModal() {
            document.getElementById('excelUploadModal').style.display = 'flex';
        }

        function closeExcelModal() {
            document.getElementById('excelUploadModal').style.display = 'none';
        }

        function goToGateway() {
            if (confirm("로그아웃하시겠습니까?")) {
                window.location.replace("index.html");
            }
        }

        function handleMenuClick(sectionId) {
            window.location.href = `page1.html${window.location.search}#${sectionId}`;
        }

        window.onload = async () => {
            const titleElement = document.getElementById('projectTitle');
            if (titleElement && typeof projectKeyName !== 'undefined') {
                titleElement.innerText = projectKeyName; 
            }
            if (typeof renderDataTable === 'function') await renderDataTable();
        };
    </script>
</body>
</html>
