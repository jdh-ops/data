<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 데이터 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="handleMenuClick('dashboard')"><i>🖼️</i> <span>정품 이미지 저장</span></div>
            <div class="menu-item active" onclick="goPage('page2.html')"><i>📊</i> <span>데이터 관리</span></div>
            <div class="menu-item" onclick="handleMenuClick('upload')"><i>📤</i> <span>파일 업로드</span></div>
            <div class="menu-item" onclick="handleMenuClick('settings')"><i>⚙️</i> <span>설정</span></div>
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;"><i>🚪</i> <span>로그아웃</span></div>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <div class="main-content">
        <h2 class="fw-bold mb-4">
            📊 데이터 관리 
            <button class="btn-select" onclick="openChartTab()" style="font-size: 14px; margin-left: 10px; vertical-align: middle;">📈 차트 분석 (새 탭)</button>
        </h2>
    
        <div class="top-controls">
            <div class="search-group">
                <input type="text" id="tableSearchInput" class="search-input" placeholder="검색어를 입력하세요..." onkeyup="filterTable()">
                <button class="btn-select" onclick="resetTableFilter()">초기화</button>
            </div>
            <div class="button-group" style="display: flex; gap: 8px;">
                <button id="editModeToggle" class="btn-select" onclick="toggleEditMode()">✏️ 수정하기</button>
                <button class="btn-primary" onclick="openExcelUploadModal()">📤 엑셀 업로드</button> 
            </div>
        </div>
    
        <div id="editModeBar" style="display: none; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 15px; background: #fffcf0; border: 1px solid #fbd38d; border-radius: 8px;">
            <div class="left-btns">
                <button class="btn-select" onclick="selectAllRows(true)">전체 선택</button>
                <button class="btn-select" onclick="selectAllRows(false)">전체 취소</button>
            </div>
            <div class="right-btns" style="display: flex; gap: 8px;">
                <button class="btn-select" onclick="openColumnManagementModal()">⚙️ 열 설정</button>
                <button class="btn-select" onclick="addNewRow()">➕ 행 추가</button>
                <button class="btn-select" style="color: red; border-color: #feb2b2;" onclick="deleteSelectedRows()">🗑️ 삭제</button>
            </div>
        </div>
    
        <div class="card shadow-sm" style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div id="dataManagerContainer" style="max-height: calc(100vh - 250px); overflow-y: auto;"></div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="lib_data.js"></script>    <script src="page_manager.js"></script> <script>
        // 페이지 초기화 실행
        window.onload = async () => {
            try {
                // 타이틀 설정
                const titleElement = document.getElementById('projectTitle');
                if (titleElement && typeof projectKeyName !== 'undefined') {
                    titleElement.innerText = projectKeyName;
                }
    
                // 데이터 관리 표 렌더링 실행 (page_manager.js에 정의됨)
                if (typeof renderDataTable === 'function') {
                    await renderDataTable();
                    console.log("관리 페이지 데이터 로드 완료");
                }
            } catch (e) {
                console.error("초기화 오류:", e);
            }
        };
    
        // 공통 유틸 함수 (HTML 내 버튼 클릭용)
        function goPage(p) { window.location.href = p + window.location.search; }
        function handleMenuClick(id) { window.location.href = `page1.html${window.location.search}#${id}`; }
        function goToGateway() { if (confirm("로그아웃하시겠습니까?")) window.location.replace("index.html"); }
    
        // 모달 제어 함수 (page_manager.js에서 호출함)
        function showModal(content) {
            const modal = document.getElementById('commonModal');
            if (modal) {
                modal.querySelector('.modal-content').innerHTML = content;
                modal.style.display = 'flex';
            }
        }
        function closeModal() { document.getElementById('commonModal').style.display = 'none'; }
        function closeExcelModal() { document.getElementById('excelUploadModal').style.display = 'none'; }
    </script>
    
    <script>
        // 공통 페이지 이동
        function goPage(page) { window.location.href = page + window.location.search; }

        // 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            document.querySelector('.toggle-btn').innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        // [핵심] 차트 페이지 새 탭 열기 (파라미터 전달)
        function openChartTab() {
            const params = window.location.search;
            if (!params) return alert("프로젝트 정보가 없습니다.");
            window.open(`chart.html${params}`, '_blank');
        }

        // 모달 제어
        function showModal(content) {
            const modal = document.getElementById('commonModal');
            if (modal) {
                // 모달 내부의 특정 컨테이너(.modal-content)에 HTML 주입
                modal.querySelector('.modal-content').innerHTML = content;
                modal.style.display = 'flex';
            } else {
                console.error("ID가 'commonModal'인 요소를 찾을 수 없습니다.");
            }
        }

        function closeModal() {
            const modal = document.getElementById('commonModal');
            if (modal) modal.style.display = 'none';
        }
        function closeExcelModal() { document.getElementById('excelUploadModal').style.display = 'none'; }

        // 초기화 실행
        window.onload = async () => {
            try {
                // 1. 타이틀 설정
                const titleElement = document.getElementById('projectTitle');
                if (titleElement && typeof projectKeyName !== 'undefined') {
                    titleElement.innerText = projectKeyName;
                }

                // 2. 표 렌더링 실행
                if (typeof renderDataTable === 'function') {
                    await renderDataTable();
                    console.log("표 렌더링 완료");
                }
            } catch (e) {
                console.error("초기화 중 오류:", e);
            }
        };

        // 페이지 이동용 함수
        function goPage(p) { window.location.href = p + window.location.search; }
        function handleMenuClick(id) { window.location.href = `page1.html${window.location.search}#${id}`; }
        function goToGateway() { if (confirm("로그아웃하시겠습니까?")) window.location.replace("index.html"); }
    </script>

<div id="excelUploadModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px;">
            <h5 class="modal-title" style="margin: 0; font-weight: bold;">📤 엑셀 데이터 업로드</h5>
            <button type="button" onclick="closeExcelModal()" style="border:none; background:none; cursor:pointer; font-size:24px; color:#aaa;">✕</button>
        </div>
        <div class="modal-body">
            <div id="excelDropZone" 
                 style="border: 2px dashed #cbd5e0; border-radius: 12px; padding: 40px 20px; text-align: center; background: #f8fafc; cursor: pointer;"
                 onclick="document.getElementById('excelFileInput').click()" 
                 ondragover="handleExcelDragOver(event)" 
                 ondragleave="handleExcelDragLeave(event)" 
                 ondrop="handleExcelDrop(event)">
                <div style="font-size: 30px; margin-bottom: 10px;">📊</div>
                <p id="excelDropText" style="margin: 0; color: #4a5568;">파일을 클릭하거나 이 곳에 드롭하세요.</p>
                <input type="file" id="excelFileInput" hidden accept=".xlsx, .xls" onchange="handleExcelSelect(event)">
            </div>

            <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                <p style="font-weight: bold; font-size: 14px; margin-bottom: 10px;">⚙️ 업로드 방식 선택</p>
                <label style="cursor: pointer;"><input type="radio" name="uploadMode" value="append" checked> 기존 데이터에 추가</label>
                <label style="margin-left: 15px; color: #e74c3c; cursor: pointer;"><input type="radio" name="uploadMode" value="overwrite"> 기존 데이터 대체 (삭제 후 삽입)</label>
            </div>
            <p id="excelFileName" style="margin-top: 15px; font-weight: bold; color: #3498db; text-align: center; font-size: 14px;"></p>
        </div>
        <div class="modal-footer" style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="startExcelUploadBtn" class="btn-primary" style="flex: 1; padding: 12px;" onclick="processExcelUpload()" disabled>업로드 시작</button>
            <button class="btn-select" style="flex: 1; padding: 12px;" onclick="closeExcelModal()">취소</button>
        </div>
    </div>
</div>

<div id="commonModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto;"></div>
</div>

</body>
</html>
