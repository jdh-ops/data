<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 데이터 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="handleMenuClick('dashboard')"><i>🖼️</i> <span>정품 이미지 저장</span></div>
            <div class="menu-item active" onclick="goPage('page2.html')"><i>📊</i> <span>데이터 관리</span></div>
            <div class="menu-item" onclick="handleMenuClick('upload')"><i>📤</i> <span>파일 업로드</span></div>
            <div class="menu-item" onclick="handleMenuClick('settings')"><i>⚙️</i> <span>설정</span></div>
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;"><i>🚪</i> <span>로그아웃</span></div>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()" style="position: absolute; bottom: 20px; right: 20px; background: #34495e; color: white; border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer;">◀</button>
    </div>

    <div class="main-content">
        <h2 class="fw-bold mb-4">📊 데이터 관리 <button class="btn-select" onclick="openChartTab()" style="font-size: 14px; margin-left: 10px; vertical-align: middle;">📈 차트 분석 (새 탭)</button></h2>
    
        <div class="top-controls">
            <div class="search-group">
                <input type="text" id="tableSearchInput" class="search-input" placeholder="검색어를 입력하세요..." onkeyup="filterTable()">
                <button class="btn-select" onclick="resetTableFilter()">초기화</button>
            </div>
            <div class="button-group" style="display: flex; gap: 8px;">
                <button id="editModeToggle" class="btn-select" onclick="toggleEditMode()">✏️ 수정하기</button>
                <button class="btn-primary" onclick="openExcelUploadModal()">📤 엑셀 업로드</button> 
            </div>
        </div>
    
        <div id="editModeBar">
            <div class="left-btns">
                <button class="btn-select" onclick="selectAllRows(true)">전체 선택</button>
                <button class="btn-select" onclick="selectAllRows(false)">전체 취소</button>
            </div>
            <div class="right-btns" style="display: flex; gap: 8px;">
                <button class="btn-select" onclick="openColumnManagementModal()">⚙️ 열 설정</button>
                <button class="btn-select" onclick="addNewRow()">➕ 행 추가</button>
                <button class="btn-select" style="color: red; border-color: #feb2b2;" onclick="deleteSelectedRows()">🗑️ 삭제</button>
            </div>
        </div>
    
        <div class="card shadow-sm" style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div id="dataManagerContainer" style="max-height: calc(100vh - 250px); overflow-y: auto;"></div>
        </div>
    </div>
    
    <div id="excelUploadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">📤 엑셀 데이터 업로드</h5>
                <button type="button" onclick="closeExcelModal()" style="border:none; background:none; cursor:pointer; font-size:24px; color:#aaa;">✕</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 15px; text-align: right;">
                    <button class="btn-select" onclick="downloadExcelTemplate()">📄 템플릿 다운로드</button>
                </div>
                <div id="excelDropZone" onclick="document.getElementById('excelFileInput').click()" ondragover="handleExcelDragOver(event)" ondragleave="handleExcelDragLeave(event)" ondrop="handleExcelDrop(event)">
                    <div style="font-size: 30px; margin-bottom: 10px;">📊</div>
                    <p id="excelDropText">파일을 드래그하거나 클릭하여 선택하세요.</p>
                    <input type="file" id="excelFileInput" hidden accept=".xlsx, .xls" onchange="handleExcelSelect(event)">
                </div>
                <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <p style="font-weight: bold; font-size: 14px; margin-bottom: 10px;">⚙️ 업로드 방식</p>
                    <label><input type="radio" name="uploadMode" value="append" checked> 기존 데이터에 추가</label>
                    <label style="margin-left: 15px; color: #e74c3c;"><input type="radio" name="uploadMode" value="overwrite"> 기존 데이터 대체</label>
                    <p id="overwriteWarning" style="display: none; color: #e74c3c; font-size: 11px; margin-top: 8px;">⚠️ 프로젝트의 모든 기존 데이터가 삭제됩니다.</p>
                </div>
                <p id="excelFileName" style="margin-top: 10px; font-weight: bold; color: var(--primary-color); text-align: center;"></p>
            </div>
            <div class="modal-footer" style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="startExcelUploadBtn" class="btn-primary" style="flex: 1;" onclick="processExcelUpload()" disabled>업로드 시작</button>
                <button class="btn-select" style="flex: 1;" onclick="closeExcelModal()">취소</button>
            </div>
        </div>
    </div>

    <div id="commonModal" class="modal">
        <div class="modal-content" style="max-height: 80vh; overflow-y: auto;"></div>
    </div>

    <script src="config.js"></script>
    <script src="datamng.js"></script>
    <script>
        function goPage(p) { window.location.href = p + window.location.search; }
        function toggleSidebar() { 
            const s = document.getElementById('sidebar'); 
            s.classList.toggle('collapsed'); 
            document.querySelector('.toggle-btn').innerText = s.classList.contains('collapsed') ? '▶' : '◀';
        }
        function openChartTab() { window.open(`chart.html${window.location.search}`, '_blank'); }
        function showModal(h) { 
            const m = document.getElementById('commonModal'); 
            m.querySelector('.modal-content').innerHTML = h; 
            m.style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('commonModal').style.display = 'none'; }
        function closeExcelModal() { document.getElementById('excelUploadModal').style.display = 'none'; }
        function goToGateway() { if (confirm("로그아웃하시겠습니까?")) window.location.replace("index.html"); }
        function handleMenuClick(id) { window.location.href = `page1.html${window.location.search}#${id}`; }
        window.onload = async () => {
            const t = document.getElementById('projectTitle');
            if (t && typeof projectKeyName !== 'undefined') t.innerText = projectKeyName;
            if (typeof renderDataTable === 'function') await renderDataTable();
        };
    </script>
</body>
</html>
