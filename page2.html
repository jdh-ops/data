<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 데이터 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="handleMenuClick('dashboard')"><i>🖼️</i> <span>정품 이미지 저장</span></div>
            <div class="menu-item active" onclick="goPage('page2.html')"><i>📊</i> <span>데이터 관리</span></div>
            <div class="menu-item" onclick="handleMenuClick('upload')"><i>📤</i> <span>파일 업로드</span></div>
            <div class="menu-item" onclick="handleMenuClick('settings')"><i>⚙️</i> <span>설정</span></div>
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;"><i>🚪</i> <span>로그아웃</span></div>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <div class="main-content">
        <h2 class="fw-bold mb-4">📊 데이터 관리</h2>
    
        <div class="top-controls">
            <div class="search-group">
                <input type="text" id="tableSearchInput" class="search-input" placeholder="검색어를 입력하세요 (상품명, 태그 등)...">
                <button class="btn-select" onclick="resetTableFilter()">초기화</button>
            </div>
            
            <div class="button-group" style="display: flex; gap: 8px;">
                <button id="editModeToggle" class="btn-select" onclick="toggleEditMode()">✏️ 수정하기</button>
                <button class="btn-select" onclick="openColumnManagementModal()">⚙️ 열 설정</button>
                <label class="btn-primary" style="display: inline-block; line-height: 35px; padding: 0 20px; height: 40px; border-radius: 6px; cursor: pointer;">
                    Excel 업로드 <input type="file" hidden onchange="handleExcelUpload(event)">
                </label>
            </div>
        </div>
    
        <div class="card shadow-sm" style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee;">
            <div id="dataManagerContainer"></div>
        </div>
    </div>
    
            <div class="card shadow-sm">
                <div id="dataManagerContainer" class="table-responsive">
                    </div>
            </div>
        </div>
    </div>
    
    <div id="dataEditModal" class="modal">
        <div class="modal-content" style="width: 500px;">
            <h4 id="dataEditModalTitle" class="mb-4">📝 데이터 수정</h4>
            <div id="dataEditFields" class="d-flex flex-column gap-3">
                </div>
            <div class="d-flex gap-2 mt-4">
                <button id="saveDataBtn" class="btn btn-primary flex-fill">변경사항 저장</button>
                <button onclick="closeDataEditModal()" class="btn btn-light flex-fill">취소</button>
            </div>
        </div>
    </div>

    <div id="commonModal" class="modal">
        <div class="modal-content" style="width: 500px; max-height: 80vh; overflow-y: auto;">
            </div>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">✨ 새 이미지 등록</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div id="thumbPasteZone" tabindex="0" onpaste="handleImagePaste(event, 'thumb')" style="flex:1; height:120px; border:2px dashed #cbd5e0; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#f8fafc; outline:none;">
                    <span id="thumbText" style="font-size:12px; color:#718096;">🖼️ 섬네일</span>
                    <img id="thumbPreview" style="display:none; width:100%; height:100%; object-fit:contain;">
                </div>
                <div id="realPasteZone" tabindex="0" onpaste="handleImagePaste(event, 'real')" style="flex:1; height:120px; border:2px dashed #cbd5e0; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#f8fafc; outline:none;">
                    <span id="realText" style="font-size:12px; color:#718096;">📸 원본</span>
                    <img id="realPreview" style="display:none; width:100%; height:100%; object-fit:contain;">
                </div>
            </div>
            <input type="text" id="tagsInput" placeholder="태그 (쉼표 구분)" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom:10px;">
            <input type="text" id="productUrl" placeholder="상품 URL" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:20px;">
            <input type="hidden" id="thumbUrl"><input type="hidden" id="realUrl">
            <div style="display:flex; gap:10px;">
                <button id="saveImgBtn" onclick="saveImage()" class="btn-primary" style="flex:1;" disabled>이미지 대기 중...</button>
                <button onclick="closeAddPopup()" class="btn-select" style="flex:1;">취소</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth-image-logic.js"></script>
    <script src="datamng.js"></script>

    <script>
        // 페이지 이동 함수 (table 파라미터 유지)
        function goPage(page) {
            const currentParams = window.location.search;
            window.location.href = page + currentParams;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            document.querySelector('.toggle-btn').innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }

        // 모달 제어 함수
        function showModal(contentHtml) {
            const modal = document.getElementById('commonModal');
            modal.querySelector('.modal-content').innerHTML = contentHtml;
            modal.style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('commonModal').style.display = 'none';
        }

        function goToGateway() {
            if (confirm("로그아웃하시겠습니까?")) {
                // 주소창 이력을 대체하여 뒤로가기를 방지하며 이동
                window.location.replace("index.html");
            }
        }

        // page2.html용 메뉴 클릭 핸들러
        function handleMenuClick(sectionId) {
            const params = window.location.search; // ?table=coiz&key=... 유지
            
            // 파일 업로드나 설정은 page1.html에 있으므로 이동 처리
            if (sectionId === 'upload' || sectionId === 'settings' || sectionId === 'dashboard') {
                window.location.href = `page1.html${params}#${sectionId}`;
            }
        }

        window.onload = async () => {
            const titleElement = document.getElementById('projectTitle');
            if (titleElement) {
                titleElement.innerText = projectKeyName; 
            }

            if (typeof renderDataTable === 'function') await renderDataTable();
        };
    </script>
</body>
</html>
