<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 데이터 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. 기본 테이블 구조 및 행 높이 고정 */
        .manager-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            font-size: 14px;
            table-layout: fixed; /* 열 너비 고정 및 성능 향상 */
        }
    
        .manager-table th, .manager-table td {
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            height: 45px;      /* [핵심] 행 높이 고정 */
            max-height: 45px;
            box-sizing: border-box;
        }
    
        .manager-table thead th {
            background: #f8fafc;
            font-weight: bold;
            position: sticky; /* 스크롤 시 헤더 고정 */
            top: 0;
            z-index: 10;
        }
    
        .manager-table tbody tr:hover {
            background-color: #f1f5f9;
        }
    
        /* 2. [신규] 체크박스 열 제어 (딜레이 방지 핵심) */
        .col-checkbox {
            width: 50px !important;
            text-align: center;
        }
    
        /* 수정 모드 활성화 시(edit-active 클래스 추가 시) 체크박스 열 노출 */
        .edit-active .col-checkbox {
            display: table-cell;
        }
    
        /* 3. 수정 모드 시 입력창 스타일 */
        .manager-table input[type="text"] {
            width: 100%;
            height: 32px;
            border: 2px solid #3182ce; /* 포커스 시 색상 강조 */
            border-radius: 4px;
            padding: 2px 5px;
            text-align: center;
            outline: none;
        }
    
        /* 편집 가능한 셀에 마우스 오버 시 효과 */
        .edit-active td[onclick] {
            cursor: pointer;
            background-color: #fffaf0; /* 편집 가능 영역임을 시각적으로 암시 */
        }

        .row-checkbox {
            cursor: pointer;
            transform: scale(1.1);
        }

        /* 프리셋 모달 전용 스타일 (잘리지 않도록 max-height 사용) */
        .column-modal-container {
            display: flex;
            max-height: calc(100vh - 100px);
            min-height: 400px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* 왼쪽 사이드바 */
        .preset-sidebar {
            width: 200px;
            background: #f8fafc;
            border-right: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
        }

        .preset-list {
            flex: 1;
            overflow-y: auto;
        }

        .preset-item {
            padding: 12px 15px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s;
            color: #4a5568;
        }

        .preset-item:hover {
            background: #edf2f7;
        }

        .preset-item.active {
            background: #ebf8ff;
            color: #3182ce;
            font-weight: bold;
            border-left: 4px solid #3182ce;
        }

        /* 오른쪽 설정 영역 */
        .column-setting-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .column-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .preset-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 4px solid transparent; /* 기본 상태에서도 공간 확보 */
        }

        /* 스크롤바 디자인 (세련되게) */
        .column-scroll-area::-webkit-scrollbar, .preset-list::-webkit-scrollbar {
            width: 6px;
        }
        .column-scroll-area::-webkit-scrollbar-thumb, .preset-list::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .preset-item button:hover {
            color: #2d3748 !important; /* 수정 버튼 호버 */
        }
        .preset-item button[onclick*="deletePreset"]:hover {
            color: #c53030 !important; /* 삭제 버튼 호버 (진한 빨강) */
        }

    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header" id="projectTitle">PROJECT</div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="handleMenuClick('dashboard')"><i>🖼️</i> <span>정품 이미지 저장</span></div>
            <div class="menu-item active" onclick="goPage('page2.html')"><i>📊</i> <span>데이터 관리</span></div>
            <div class="menu-item" onclick="handleMenuClick('upload')"><i>📤</i> <span>파일 업로드</span></div>
            <div class="menu-item" onclick="handleMenuClick('settings')"><i>⚙️</i> <span>설정</span></div>
            <div class="menu-item" onclick="goToGateway()" style="margin-top: 20px; background: #3e4f5f;"><i>🚪</i> <span>로그아웃</span></div>
        </div>
        <button class="toggle-btn" onclick="toggleSidebar()">◀</button>
    </div>

    <div class="main-content">
        <h2 class="fw-bold mb-4">
            📊 데이터 관리 
            <button class="btn-select" onclick="openChartTab()" style="font-size: 14px; margin-left: 10px; vertical-align: middle;">📈 차트 분석 (새 탭)</button>
        </h2>
    
        <div class="top-controls" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; height: 38px;">
            <div class="search-group" style="display: flex; gap: 8px; align-items: center; flex: 1; height: 100%;">
                <select id="searchFieldSelect" class="form-select" 
                        style="width: 130px; height: 38px; border-radius: 8px; border: 1px solid #cbd5e0; padding: 0 10px; box-sizing: border-box;">
                    <option value="all">전체 검색</option>
                </select>
                
                <input type="text" id="tableSearchInput" class="search-input" placeholder="검색어를 입력하세요..." 
                       style="flex: 1; height: 38px; border: 1px solid #cbd5e0; border-radius: 8px; padding: 0 12px; box-sizing: border-box; font-size: 14px;" 
                       onkeyup="if(event.key==='Enter') searchData()">
                
                <button class="btn-primary" onclick="searchData()" 
                        style="padding: 0 20px; height: 38px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">검색</button>
                <button class="btn-select" onclick="resetTableFilter()" 
                        style="padding: 0 15px; height: 38px; border-radius: 8px; border: 1px solid #cbd5e0; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center;">초기화</button>
            </div>
        
            <div class="button-group" style="display: flex; gap: 8px; height: 100%;">
                <button class="btn-select" style="color: red; border-color: #feb2b2;" onclick="deleteSelectedRows()">🗑️ 삭제</button>
                <button id="editModeToggle" class="btn-select" onclick="toggleEditMode()"
                        style="height: 38px; padding: 0 15px; border-radius: 8px; border: 1px solid #cbd5e0; background: white; cursor: pointer;">✏️ 수정하기</button>
            </div>
        </div>
    
        <div id="editModeBar" style="display: none; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 15px; background: #fffcf0; border: 1px solid #fbd38d; border-radius: 8px;">
            <div class="left-btns">
                <button class="btn-select" onclick="selectAllRows(true)">전체 선택</button>
                <button class="btn-select" onclick="selectAllRows(false)">전체 취소</button>
            </div>
            <div class="right-btns" style="display: flex; gap: 8px;">
                <button class="btn-select" onclick="openColumnManagementModal()">⚙️ 열 설정</button>
                <button class="btn-select" onclick="addNewRow()">➕ 행 추가</button>
            </div>
        </div>
    
        <div class="card shadow-sm" style="background: white; border-radius: 12px; overflow: hidden; border: 1px solid #eee; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <div class="table-info-bar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #e2e8f0; background: #f8fafc;">
                <span id="dataRowCount" style="font-size: 14px; font-weight: 600; color: #4a5568;">총 0건</span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-select" onclick="openExcelUploadModal()" style="padding: 6px 14px; font-size: 13px;">📤 엑셀 업로드</button>
                    <button type="button" class="btn-select" onclick="downloadCurrentExcel()" style="padding: 6px 14px; font-size: 13px;">📥 엑셀 다운로드</button>
                </div>
            </div>
            <div id="dataManagerContainer" style="max-height: calc(100vh - 290px); overflow-y: auto;"></div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="lib_data.js"></script>    
    <script src="page_manager.js"></script> 
    
    <script>
        // 1. 페이지 초기화 (중복 제거 및 통합)
        window.onload = async () => {
            try {
                // [1] 보안 체크: 최상단에서 실행
                // config.js의 함수를 호출하거나 직접 Supabase 인증 확인
                const { data: { user } } = await _supabase.auth.getUser();

                // 로그인 정보가 없거나 도메인이 wegofair.com이 아니면 즉시 퇴출
                if (!user || !user.email.endsWith('@wegofair.com')) {
                    alert("접근 권한이 없습니다. 로그인 페이지로 이동합니다.");
                    window.location.replace("index.html");
                    return; // 이후 로직 실행 방지
                }

                // [2] 사이드바 사용자 정보 표시 (UI 추가 시)
                const userEmailEl = document.getElementById('userEmail');
                if (userEmailEl) userEmailEl.innerText = user.email;

                // --- 여기서부터 기존 초기화 로직 ---

                // 프로젝트 타이틀 설정
                const titleElement = document.getElementById('projectTitle');
                if (titleElement && typeof projectKeyName !== 'undefined') {
                    titleElement.innerText = projectKeyName;
                }

                // 데이터 관리 표 렌더링
                if (typeof renderDataTable === 'function') {
                    await renderDataTable();
                    console.log("관리 페이지 초기화 완료 - 인증된 사용자: " + user.email);
                }

            } catch (e) {
                console.error("초기화 오류:", e);
                // 오류 발생 시 보안을 위해 로그인 페이지로 보내는 것이 안전할 수 있습니다.
            }
        };
    
        // 2. 공통 이동 및 유틸리티 함수
        function goPage(p) { window.location.href = p + window.location.search; }
        function handleMenuClick(id) { window.location.href = `page1.html${window.location.search}#${id}`; }
        function goToGateway() { if (confirm("로그아웃하시겠습니까?")) window.location.replace("index.html"); }
        
        // 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            document.querySelector('.toggle-btn').innerText = sidebar.classList.contains('collapsed') ? '▶' : '◀';
        }
    
        // 차트 분석 새 탭 열기 (현재 검색 조건이 있으면 해당 데이터만 차트에 반영)
        function openChartTab() {
            let params = window.location.search || '';
            const searchInput = document.getElementById('tableSearchInput');
            const searchFieldSelect = document.getElementById('searchFieldSelect');
            const keyword = searchInput && searchInput.value ? searchInput.value.trim() : '';
            const searchField = (searchFieldSelect && searchFieldSelect.value) ? searchFieldSelect.value : 'all';
            if (keyword) {
                params += (params ? '&' : '?') + 'search=' + encodeURIComponent(keyword) + '&searchField=' + encodeURIComponent(searchField);
            }
            if (!params || params === '?') return alert("프로젝트 정보가 없습니다.");
            window.open('chart.html' + params, '_blank');
        }
    
        // 3. 모달 제어 함수
        function showModal(content) {
            const modal = document.getElementById('commonModal');
            if (modal) {
                modal.querySelector('.modal-content').innerHTML = content;
                modal.style.display = 'flex';
            }
        }
        function closeModal() { document.getElementById('commonModal').style.display = 'none'; }
        
        // 엑셀 업로드 모달 전용
        function openExcelUploadModal() { document.getElementById('excelUploadModal').style.display = 'flex'; }
        function closeExcelModal() { document.getElementById('excelUploadModal').style.display = 'none'; }
    </script>

<div id="excelUploadModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px;">
            <h5 class="modal-title" style="margin: 0; font-weight: bold;">📤 엑셀 데이터 업로드</h5>
            <button type="button" onclick="closeExcelModal()" style="border:none; background:none; cursor:pointer; font-size:24px; color:#aaa;">✕</button>
        </div>
        <div class="modal-body">
            <div id="excelDropZone" 
                 style="border: 2px dashed #cbd5e0; border-radius: 12px; padding: 40px 20px; text-align: center; background: #f8fafc; cursor: pointer;"
                 onclick="document.getElementById('excelFileInput').click()" 
                 ondragover="handleExcelDragOver(event)" 
                 ondragleave="handleExcelDragLeave(event)" 
                 ondrop="handleExcelDrop(event)">
                <div style="font-size: 30px; margin-bottom: 10px;">📊</div>
                <p id="excelDropText" style="margin: 0; color: #4a5568;">파일을 클릭하거나 이 곳에 드롭하세요.</p>
                <input type="file" id="excelFileInput" hidden accept=".xlsx, .xls" onchange="handleExcelSelect(event)">
            </div>

            <div style="margin-top: 10px; text-align: right;">
                <a href="javascript:void(0)" onclick="downloadExcelTemplate()" 
                   style="font-size: 13px; color: #718096; text-decoration: underline; display: inline-flex; align-items: center; gap: 4px;">
                    업로드용 템플릿 다운로드
                </a>
            </div>

            <div style="margin-top: 20px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                <p style="font-weight: bold; font-size: 14px; margin-bottom: 10px;">⚙️ 업로드 방식 선택</p>
                <label style="cursor: pointer;"><input type="radio" name="uploadMode" value="append" checked> 기존 데이터에 추가</label>
                <label style="margin-left: 15px; color: #e74c3c; cursor: pointer;"><input type="radio" name="uploadMode" value="overwrite"> 기존 데이터 대체 (삭제 후 삽입)</label>
            </div>
            <p id="excelFileName" style="margin-top: 15px; font-weight: bold; color: #3498db; text-align: center; font-size: 14px;"></p>
        </div>
        <div class="modal-footer" style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="startExcelUploadBtn" class="btn-primary" style="flex: 1; padding: 12px;" onclick="processExcelUpload()" disabled>업로드 시작</button>
            <button class="btn-select" style="flex: 1; padding: 12px;" onclick="closeExcelModal()">취소</button>
        </div>
    </div>
</div>

<div id="commonModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; overflow-y: auto;">
    <div class="modal-content" style="background: white; border-radius: 12px; max-height: calc(100vh - 40px); overflow-y: auto; transition: width 0.3s ease; margin: auto;">
        </div>
</div>

<div id="addRowModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="modal-content" style="background: white; padding: 25px; border-radius: 12px; width: 80%; max-width: 1000px; max-height: 85vh; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">➕ 데이터 일괄 추가</h3>
            <button onclick="closeAddRowModal()" style="border:none; background:none; font-size:20px; cursor:pointer;">✕</button>
        </div>
        
        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">
            💡 엑셀에서 데이터를 복사(Ctrl+C)한 후, 아래 표의 첫 번째 칸을 클릭하고 붙여넣기(Ctrl+V) 하세요.
        </p>

        <div id="handsontableContainer" style="flex: 1; overflow: hidden; border: 1px solid #ddd; border-radius: 4px;">
            </div>

        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn-primary" onclick="submitNewRows()" style="padding: 10px 25px;">DB에 저장하기</button>
            <button class="btn-select" onclick="closeAddRowModal()" style="padding: 10px 25px;">취소</button>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
<script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>

</body>
</html>
