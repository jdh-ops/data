<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>피벗 분석 리포트 빌더</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f1f5f9; padding: 40px; display: block; height: auto; overflow-y: auto; }
        .builder-container { max-width: 1100px; margin: 0 auto; }
        .preset-card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .preset-type-badge { position: absolute; top: 15px; right: 15px; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .report-item { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .pivot-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .saved-presets-bar { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #cbd5e0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn-select:hover { background: #edf2f7; }
    </style>
</head>
<body>
    <div class="builder-container" id="builderView">
        <h2 class="fw-bold mb-4">⚒️ 리포트 프리셋 빌더</h2>
        
        <div class="saved-presets-bar" id="savedPresetsBar">
            <span class="small fw-bold">💾 저장된 프리셋:</span>
            <div id="presetButtons" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <span style="color: #94a3b8; font-size: 13px;">불러오는 중...</span>
            </div>
        </div>

        <div class="mb-4" style="display: flex; gap: 10px;">
            <button class="btn-select" onclick="addPreset('table')">📋 표(Table) 프리셋 추가</button>
            <button class="btn-select" onclick="addPreset('chart')">📊 그래프(Chart) 프리셋 추가</button>
        </div>

        <div id="presetList"></div>

        <div class="mt-5 text-center">
            <button class="btn-primary" style="width: 100%; height: 55px; font-size: 18px; background: #3498db; border: none; color: white; border-radius: 8px; cursor: pointer;" onclick="generateReport()">🚀 리포트 생성하기</button>
        </div>
    </div>

    <div class="builder-container" id="reportView" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="fw-bold">📑 분석 리포트 결과</h2>
            <button class="btn-select" onclick="location.reload()">🔄 빌더로 돌아가기</button>
        </div>
        <div id="reportContainer"></div>
    </div>

    <script src="config.js"></script>
    <script src="lib_data.js"></script>  <script src="page_chart.js"></script> <script>
        window.onload = async () => {
            // 차트 페이지 데이터 초기화 (page_chart.js에 정의됨)
            const success = await initChartPage();
            if (success) {
                // 저장된 프리셋 목록 불러오기
                if (typeof loadPresets === 'function') {
                    await loadPresets();
                    console.log("분석 프리셋 로드 완료");
                }
            } else {
                alert("데이터를 불러오지 못했습니다. URL 파라미터를 확인하세요.");
            }
        };
    
        // 프리셋 버튼 목록 생성 (page_chart.js의 loadPresets 결과물 출력)
        window.renderPresetButtons = function(data) {
            const container = document.getElementById('presetButtons');
            if (!data || data.length === 0) {
                container.innerHTML = '<span style="color: #94a3b8; font-size: 13px;">저장된 프리셋이 없습니다.</span>';
                return;
            }
            container.innerHTML = data.map(p => `
                <button class="btn-select" style="font-size: 12px; padding: 5px 12px;" onclick="applyPreset('${encodeURIComponent(JSON.stringify(p))}')">
                    ${p.preset_name}
                </button>
            `).join('');
        };
    
        // 저장된 프리셋을 UI에 적용 (addPreset은 chart.html 내부 함수)
        window.applyPreset = function(encodedData) {
            const preset = JSON.parse(decodeURIComponent(encodedData));
            addPreset(preset.type, preset.config, preset.preset_name);
        };
    </script>
    
    <script>
        let presetCount = 0;

        window.onload = async () => {
            const success = await initChartPage();
            if (success) { loadPresets(); }
        };

        window.renderPresetButtons = function(data) {
            const container = document.getElementById('presetButtons');
            if (!data || data.length === 0) {
                container.innerHTML = '<span style="color: #94a3b8; font-size: 13px;">저장된 프리셋이 없습니다.</span>';
                return;
            }
            container.innerHTML = data.map(p => `
                <button class="btn-select" style="font-size: 12px; padding: 5px 12px;" onclick="applyPreset('${encodeURIComponent(JSON.stringify(p))}')">
                    ${p.preset_name}
                </button>
            `).join('');
        };

        window.applyPreset = function(encodedData) {
            const preset = JSON.parse(decodeURIComponent(encodedData));
            addPreset(preset.type, preset.config, preset.preset_name);
        };

        // [피벗 테이블 방식] 프리셋 카드 추가 (필터, 행, 열, 날짜형식 모두 포함)
        function addPreset(type, savedConfig = null, savedName = "") {
            presetCount++;
            const id = `preset_${presetCount}`;
            
            // lib_data.js의 currentLayout에서 사용 가능한 열 목록 생성
            const layoutOptions = currentLayout.filter(c => c.isVisible).map(col => 
                `<option value="col${col.id}_val">${col.customName || col.defaultName}</option>`
            ).join('');

            const presetHtml = `
                <div class="preset-card" id="${id}" data-type="${type}">
                    <span class="preset-type-badge" style="background:${type === 'table' ? '#4a5568' : '#3498db'}">
                        ${type === 'table' ? 'PIVOT TABLE' : 'ANALYSIS CHART'}
                    </span>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #f1f5f9; padding-bottom:15px;">
                        <input type="text" class="p-name form-control" style="width:300px; font-weight:bold;" placeholder="프리셋 이름을 입력하세요" value="${savedName}">
                        <button class="btn-select" style="background: #ebf8ff; color: #2b6cb0; border-color: #bee3f8;" onclick="saveThisPreset('${id}')">💾 프리셋 저장</button>
                    </div>
                    
                    <div class="pivot-controls">
                        <div>
                            <label class="form-label">1. 필터링 (키워드)</label>
                            <input type="text" class="p-filter form-control" placeholder="예: 정품" value="${savedConfig?.filter || ''}">
                        </div>
                        <div>
                            <label class="form-label">2. 행 (Rows / X축)</label>
                            <select class="p-x form-select">
                                <option value="monthly" ${savedConfig?.x === 'monthly' ? 'selected' : ''}>📅 월별 합산 (날짜 기준)</option>
                                ${layoutOptions}
                            </select>
                        </div>
                        <div>
                            <label class="form-label">3. 열 (Columns / 구분)</label>
                            <select class="p-y-base form-select">
                                <option value="total" ${savedConfig?.yBase === 'total' ? 'selected' : ''}>Σ 합계 (구분 없음)</option>
                                ${layoutOptions}
                            </select>
                        </div>
                        <div>
                            <label class="form-label">4. 날짜 정렬 방식</label>
                            <select class="p-date-format form-select">
                                <option value="raw" ${savedConfig?.dateFormat === 'raw' ? 'selected' : ''}>일반 문자열 순</option>
                                <option value="monthOnly" ${savedConfig?.dateFormat === 'monthOnly' ? 'selected' : ''}>숫자 월 순 (2월, 3월...)</option>
                                <option value="yyyy-mm" ${savedConfig?.dateFormat === 'yyyy-mm' ? 'selected' : ''}>연월 순 (2024.02...)</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="document.getElementById('${id}').remove()" style="margin-top:20px; color:#e74c3c; border:none; background:none; cursor:pointer; font-size:12px;">❌ 프리셋 삭제</button>
                </div>
            `;
            
            document.getElementById('presetList').insertAdjacentHTML('beforeend', presetHtml);
            
            // 저장된 프리셋 로드 시 select 값 강제 매칭
            if (savedConfig) {
                const el = document.getElementById(id);
                el.querySelector('.p-x').value = savedConfig.x;
                el.querySelector('.p-y-base').value = savedConfig.yBase;
                el.querySelector('.p-date-format').value = savedConfig.dateFormat || 'raw';
            }
        }

        // 프리셋 저장 시 모든 설정값 추출
        window.saveThisPreset = function(id) {
            const el = document.getElementById(id);
            const config = {
                filter: el.querySelector('.p-filter').value,
                x: el.querySelector('.p-x').value,
                yBase: el.querySelector('.p-y-base').value,
                dateFormat: el.querySelector('.p-date-format').value,
                val: 'count' // 기본값
            };
            const name = el.querySelector('.p-name').value;
            if(!name) return alert("프리셋 이름을 입력해주세요.");
            
            // page_chart.js의 saveAnalysisPreset 호출
            saveAnalysisPreset(name, config, el.dataset.type);
        };

        async function generateReport() {
            const presetElements = document.querySelectorAll('.preset-card');
            if (presetElements.length === 0) return alert("프리셋을 추가해주세요.");
            document.getElementById('builderView').style.display = 'none';
            document.getElementById('reportView').style.display = 'block';
            const container = document.getElementById('reportContainer');
            container.innerHTML = '';
            presetElements.forEach((el, index) => {
                const type = el.dataset.type;
                const config = {
                    filter: el.querySelector('.p-filter').value,
                    x: el.querySelector('.p-x').value,
                    yBase: el.querySelector('.p-y-base').value
                };
                const itemDiv = document.createElement('div');
                itemDiv.className = 'report-item';
                itemDiv.innerHTML = `<h3 class="mb-4">#${index+1} ${el.querySelector('.p-name').value}</h3><div id="res_${index}" style="min-height:300px;"></div>`;
                container.appendChild(itemDiv);
                processAndRender(config, type, `res_${index}`);
            });
        }
    </script>
</body>
</html>
