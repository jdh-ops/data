<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트 데이터 분석 도구</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: block; overflow-y: auto; height: auto; padding: 40px;">
    <div style="max-width: 1200px; margin: 0 auto;">
        <h2 class="fw-bold mb-4">📈 맞춤형 데이터 분석 리포트</h2>
    
        <div class="card shadow-sm mb-4">
            <h5 class="fw-bold mb-3">🛠️ 분석 프리셋 설정</h5>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div>
                    <label class="form-label small fw-bold">1. 데이터 필터링</label>
                    <input type="text" id="presetFilter" class="form-control" placeholder="태그/키워드 입력">
                </div>
                <div>
                    <label class="form-label small fw-bold">2. 시각화 방식</label>
                    <select id="presetViewType" class="form-select">
                        <option value="bar">📊 막대 그래프 (Bar)</option>
                        <option value="line">📈 꺾은선 그래프 (Line)</option>
                        <option value="pie">🍕 파이 차트 (Pie)</option>
                        <option value="table">📋 표 (Table)</option>
                    </select>
                </div>
                <div>
                    <label class="form-label small fw-bold">3. X축 / 행 (기준)</label>
                    <select id="presetXAxis" class="form-select">
                        <option value="monthly">📅 월별 합산 (날짜 기준)</option>
                    </select>
                </div>
                <div>
                    <label class="form-label small fw-bold">4. Y축 / 열 (값)</label>
                    <select id="presetYAxis" class="form-select">
                        <option value="count">🔢 데이터 수량 (Count)</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-select" onclick="alert('저장되었습니다.')">💾 프리셋 저장</button>
                <button class="btn-primary" onclick="generateAnalysis()">🚀 생성하기</button>
            </div>
        </div>
    
        <div id="analysisResultArea" style="background: white; padding: 30px; border-radius: 15px; border: 1px solid #eee; min-height: 400px;">
            <p style="text-align: center; color: #94a3b8; padding-top: 150px;">설정을 완료하고 '생성하기' 버튼을 눌러주세요.</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="datamng.js"></script>
    <script>
        window.onload = async () => { await initChartPage(); };
    </script>
</body>
</html>
