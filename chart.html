<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>피벗 분석 리포트 빌더</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f1f5f9; padding: 40px; display: block; height: auto; overflow-y: auto; }
        .builder-container { max-width: 1200px; margin: 0 auto; }
        .preset-card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; min-height: 480px; }
        .preset-type-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .report-item { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .pivot-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .saved-presets-bar { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #cbd5e0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn-select:hover { background: #edf2f7; }
        .form-label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: bold; color: #4a5568; }
        #presetList { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        @media (max-width: 950px) { #presetList { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="builder-container" id="builderView">
        <h2 class="fw-bold mb-4">⚒️ 리포트 프리셋 빌더</h2>
        <div class="saved-presets-bar" id="savedPresetsBar">
            <span class="small fw-bold">💾 저장된 프리셋:</span>
            <div id="presetButtons" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <span style="color: #94a3b8; font-size: 13px;">불러오는 중...</span>
            </div>
        </div>
        <div class="mb-4" style="display: flex; gap: 10px;">
            <button class="btn-select" onclick="addPreset('table')">📋 표(Table) 프리셋 추가</button>
            <button class="btn-select" onclick="addPreset('chart')">📊 그래프(Chart) 프리셋 추가</button>
        </div>
        <div id="presetList"></div>
        <div class="generate-btn-container" style="margin-top: 80px; padding-top: 40px; border-top: 1px dashed #cbd5e0; text-align: center;">
            <button class="btn-primary" style="width: 100%; height: 65px; font-size: 20px; background: #3182ce; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;" onclick="generateReport()">🚀 리포트 생성하기</button>
        </div>
    </div>

    <div class="builder-container" id="reportView" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="fw-bold">📑 분석 리포트 결과</h2>
            <button class="btn-select" onclick="goBackToBuilder()">🔄 빌더로 돌아가기</button>
        </div>
        <div id="reportContainer"></div>
    </div>

    <script src="config.js"></script>
    <script src="lib_data.js"></script>
    <script src="page_chart.js"></script>

    <script>
        let presetCount = 0;

        window.onload = async () => {
            // 1. 페이지 초기화와 데이터 로드를 비동기로 한 번에 처리
            const success = await initChartPage(); 
            
            if (success) { 
                // 2. 프리셋 로드 (이 안에서 renderPresetButtons가 실행됨)
                await loadPresets(); 
                
                // 3. 만약 초기 데이터로 바로 리포트를 보여줘야 한다면 여기서 호출 가능
                console.log("모든 데이터 로드 및 UI 준비 완료");
            }
        };

        window.renderPresetButtons = function(data) {
            const container = document.getElementById('presetButtons');
            if (!container) return;
            
            if (!data || data.length === 0) {
                container.innerHTML = '<span style="color: #94a3b8; font-size: 13px;">저장된 프리셋이 없습니다.</span>';
                return;
            }

            container.innerHTML = data.map(p => {
                // 타입에 따른 동그라미 색상 정의
                const isTable = p.type === 'table';
                const circleColor = isTable ? '#000000' : '#3182ce'; // 표: 검정, 차트: 파란색

                return `
                    <div class="preset-item" style="display: flex; align-items: center; gap: 2px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding-right: 2px; transition: all 0.2s;">
                        <button class="btn-select" 
                                style="font-size: 12px; padding: 5px 10px; border: none; background: transparent; display: flex; align-items: center; gap: 8px; cursor: pointer;" 
                                onclick="applyPreset('${encodeURIComponent(JSON.stringify(p))}')">
                            <span style="color: ${circleColor}; font-size: 20px; line-height: 1; vertical-align: middle;">●</span>
                            <span style="font-weight: 600; color: #4a5568; line-height: 1; vertical-align: middle;">${p.preset_name}</span>
                        </button>
                        <span onclick="deleteAnalysisPreset(${p.id}, event)" 
                            style="cursor: pointer; color: #cbd5e0; font-size: 12px; padding: 2px 6px; border-left: 1px solid #f1f5f9;">✕</span>
                    </div>
                `;
            }).join('');
        };

        window.applyPreset = function(encodedData) {
            const preset = JSON.parse(decodeURIComponent(encodedData));
            addPreset(preset.type, preset.config, preset.preset_name);
        };

        function addPreset(type, savedConfig = null, savedName = "") {
            presetCount++;
            const id = `preset_${presetCount}`;
            const layoutOptions = currentLayout.filter(c => c.isVisible).map(col => 
                `<option value="col${col.id}_val">${col.customName || col.defaultName}</option>`
            ).join('');

            const chartTypeSelector = `
                <div>
                    <label class="form-label">3. 그래프 모양</label>
                    <select class="p-chart-type form-select">
                        <option value="bar" ${savedConfig?.chartType === 'bar' ? 'selected' : ''}>📊 막대</option>
                        <option value="line" ${savedConfig?.chartType === 'line' ? 'selected' : ''}>📈 선</option>
                        <option value="pie" ${savedConfig?.chartType === 'pie' ? 'selected' : ''}>🍕 파이</option>
                    </select>
                </div>`;

            const columnSelector = `
                <div>
                    <label class="form-label">3. 열 (구분)</label>
                    <select class="p-y-base form-select" onchange="toggleMonthCheck('${id}')">
                        <option value="total" ${savedConfig?.yBase === 'total' || !savedConfig ? 'selected' : ''}>합계</option>
                        ${layoutOptions}
                    </select>
                </div>`;

            const presetHtml = `
                <div class="preset-card" id="${id}" data-type="${type}">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px; border-bottom:1px solid #f1f5f9; padding-bottom:10px;">
                        <span class="preset-type-badge" style="background:${type === 'table' ? '#4a5568' : '#3498db'}">${type.toUpperCase()}</span>
                        <input type="text" class="p-name form-control" style="flex:1; font-weight:bold;" placeholder="프리셋 이름" value="${savedName}">
                        <button class="btn-select" style="width:80px; background:#ebf8ff; padding:8px;" onclick="saveThisPreset('${id}')">💾 저장</button>
                    </div>

                    <div style="background:#f8fafc; padding:12px; border-radius:8px; margin-bottom:15px;">
                        <label class="form-label">🔍 1. 필터 설정</label>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <select class="p-filter-col form-select" style="width:130px;">
                                <option value="all" ${savedConfig?.filterCol === 'all' || !savedConfig ? 'selected' : ''}>전체 검색</option>
                                ${layoutOptions}
                            </select>
                            <input type="text" class="p-filter-val form-control" style="flex:1;" placeholder="키워드 (쉼표구분)" value="${savedConfig?.filterVal || ''}">
                            <div style="display:flex; gap:5px; font-size:11px; white-space:nowrap; background:white; padding:5px 8px; border-radius:5px; border:1px solid #ced4da;">
                                <label><input type="radio" name="op_${id}" value="and" ${savedConfig?.filterOp !== 'or' && savedConfig?.filterOp !== 'not' ? 'checked' : ''}> AND</label>
                                <label><input type="radio" name="op_${id}" value="or" ${savedConfig?.filterOp === 'or' ? 'checked' : ''}> OR</label>
                                <label style="color:#e53e3e;"><input type="radio" name="op_${id}" value="not" ${savedConfig?.filterOp === 'not' ? 'checked' : ''}> 제외</label>
                            </div>
                        </div>
                    </div>

                    <div class="pivot-controls">
                        <div>
                            <label class="form-label">2. 행 (X축)</label>
                            <select class="p-x form-select" onchange="toggleMonthCheck('${id}')">
                                <option value="" disabled ${!savedConfig ? 'selected' : ''}>-- 선택 --</option>
                                ${layoutOptions}
                            </select>
                        </div>
                        
                        ${type === 'chart' ? chartTypeSelector : columnSelector}

                        <div id="month_check_area_${id}" style="grid-column: span 2; display: none; background: #fff5f5; padding: 8px; border-radius: 6px; border: 1px dashed #feb2b2; margin-top: 5px;">
                            <label style="font-size: 12px; font-weight: bold; color: #c53030; cursor: pointer;">
                                <input type="checkbox" class="p-use-month" ${savedConfig?.useMonth ? 'checked' : ''}> 📅 날짜 데이터입니다. '월별'로 묶어서 합산할까요?
                            </label>
                        </div>

                        <div style="grid-column: span 2;">
                            <label class="form-label">4. 정렬 방식</label>
                            <select class="p-date-format form-select">
                                <option value="raw" ${savedConfig?.dateFormat === 'raw' ? 'selected' : ''}>행 이름 순</option>
                                <option value="monthOnly" ${savedConfig?.dateFormat === 'monthOnly' ? 'selected' : ''}>OO월 순</option>
                                <option value="yyyy-mm" ${savedConfig?.dateFormat === 'yyyy-mm' ? 'selected' : ''}>yyyy-mm 순</option>
                                <option value="totalAsc" ${savedConfig?.dateFormat === 'totalAsc' ? 'selected' : ''}>합계 적은 순</option>
                                <option value="totalDesc" ${savedConfig?.dateFormat === 'totalDesc' ? 'selected' : ''}>합계 많은 순</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="document.getElementById('${id}').remove()" style="margin-top:15px; color:#e74c3c; border:none; background:none; font-size:11px; cursor:pointer; align-self:center;">❌ 삭제</button>
                </div>
            `;
            
            document.getElementById('presetList').insertAdjacentHTML('beforeend', presetHtml);
            
            if (savedConfig) {
                const el = document.getElementById(id);
                el.querySelector('.p-filter-col').value = savedConfig.filterCol || 'all';
                el.querySelector('.p-x').value = savedConfig.x || '';
                el.querySelector('.p-date-format').value = savedConfig.dateFormat || 'raw';
                if (type === 'table') el.querySelector('.p-y-base').value = savedConfig.yBase || 'total';
                toggleMonthCheck(id); // 저장된 프리셋 로드 시 체크박스 노출 여부 결정
            }
        }

        window.saveThisPreset = function(id) {
            const el = document.getElementById(id);
            const type = el.dataset.type;
            const config = {
                filterCol: el.querySelector('.p-filter-col').value,
                filterVal: el.querySelector('.p-filter-val').value,
                filterOp: el.querySelector(`input[name="op_${id}"]:checked`).value,
                x: el.querySelector('.p-x').value,
                dateFormat: el.querySelector('.p-date-format').value
            };
            if(type === 'chart') config.chartType = el.querySelector('.p-chart-type').value;
            else config.yBase = el.querySelector('.p-y-base').value;

            const name = el.querySelector('.p-name').value;
            if(!name) return alert("이름을 입력하세요.");
            saveAnalysisPreset(name, config, type);
        };

        async function generateReport() {
            const presets = document.querySelectorAll('.preset-card');
            if (presets.length === 0) return alert("프리셋을 추가해주세요.");
            let allValid = true;
            presets.forEach((el) => {
                if (!el.querySelector('.p-x').value) {
                    alert(`⚠️ [${el.querySelector('.p-name').value || "프리셋"}]의 행(X축)을 선택하세요.`);
                    allValid = false;
                }
            });
            if (!allValid) return;

            document.getElementById('builderView').style.display = 'none';
            document.getElementById('reportView').style.display = 'block';
            const container = document.getElementById('reportContainer');
            container.innerHTML = '';

            presets.forEach((el, index) => {
                const id = el.id;
                const type = el.dataset.type;
                const config = {
                    filterCol: el.querySelector('.p-filter-col').value,
                    filterVal: el.querySelector('.p-filter-val').value,
                    filterOp: el.querySelector(`input[name="op_${id}"]:checked`).value,
                    x: el.querySelector('.p-x').value,
                    dateFormat: el.querySelector('.p-date-format').value
                };
                if(type === 'chart') config.chartType = el.querySelector('.p-chart-type').value;
                else config.yBase = el.querySelector('.p-y-base').value;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'report-item';
                itemDiv.innerHTML = `<h3 class="mb-4">#${index+1} ${el.querySelector('.p-name').value}</h3><div id="res_${index}" style="min-height:300px;"></div>`;
                container.appendChild(itemDiv);
                processAndRender(config, type, `res_${index}`);
            });
        }

        // 날짜 필드인지 확인하여 체크박스 표시 여부 결정
        function toggleMonthCheck(presetId) {
            const el = document.getElementById(presetId);
            const xVal = el.querySelector('.p-x').value;
            const yVal = el.dataset.type === 'table' ? el.querySelector('.p-y-base').value : 'total';
            const checkArea = document.getElementById(`month_check_area_${presetId}`);

            // [중요] 보통 col1_val이 날짜인 경우가 많으므로 col1을 포함하거나, 
            // 혹은 '일자', '날짜', 'DATE'라는 단어가 포함된 열을 골랐을 때 나타나게 합니다.
            const selectedCol = currentLayout.find(c => `col${c.id}_val` === xVal || `col${c.id}_val` === yVal);
            const colName = selectedCol ? (selectedCol.customName || selectedCol.defaultName).toUpperCase() : "";
            
            if (colName.includes("날짜") || colName.includes("일자") || colName.includes("DATE") || xVal === "col1_val") {
                checkArea.style.display = "block";
            } else {
                checkArea.style.display = "none";
                el.querySelector('.p-use-month').checked = false;
            }
        }

        // 저장 함수 (useMonth 값 추가)
        window.saveThisPreset = function(id) {
            const el = document.getElementById(id);
            const type = el.dataset.type;
            const config = {
                filterCol: el.querySelector('.p-filter-col').value,
                filterVal: el.querySelector('.p-filter-val').value,
                filterOp: el.querySelector(`input[name="op_${id}"]:checked`).value,
                x: el.querySelector('.p-x').value,
                useMonth: el.querySelector('.p-use-month').checked, // 체크박스 상태 저장
                dateFormat: el.querySelector('.p-date-format').value
            };
            if(type === 'chart') config.chartType = el.querySelector('.p-chart-type').value;
            else config.yBase = el.querySelector('.p-y-base').value;

            const name = el.querySelector('.p-name').value;
            if(!name) return alert("이름을 입력하세요.");
            saveAnalysisPreset(name, config, type);
        };

        // 리포트 생성 함수 (config에 useMonth 전달)
        async function generateReport() {
            const presets = document.querySelectorAll('.preset-card');
            if (presets.length === 0) return alert("프리셋을 추가해주세요.");
            let allValid = true;
            presets.forEach((el) => {
                if (!el.querySelector('.p-x').value) {
                    alert(`⚠️ [${el.querySelector('.p-name').value || "프리셋"}]의 행(X축)을 선택하세요.`);
                    allValid = false;
                }
            });
            if (!allValid) return;

            document.getElementById('builderView').style.display = 'none';
            document.getElementById('reportView').style.display = 'block';
            const container = document.getElementById('reportContainer');
            container.innerHTML = '';

            presets.forEach((el, index) => {
                const id = el.id;
                const type = el.dataset.type;
                const config = {
                    filterCol: el.querySelector('.p-filter-col').value,
                    filterVal: el.querySelector('.p-filter-val').value,
                    filterOp: el.querySelector(`input[name="op_${id}"]:checked`).value,
                    x: el.querySelector('.p-x').value,
                    useMonth: el.querySelector('.p-use-month').checked, // 추가
                    dateFormat: el.querySelector('.p-date-format').value
                };
                if(type === 'chart') config.chartType = el.querySelector('.p-chart-type').value;
                else config.yBase = el.querySelector('.p-y-base').value;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'report-item';
                itemDiv.innerHTML = `<h3 class="mb-4">#${index+1} ${el.querySelector('.p-name').value}</h3><div id="res_${index}" style="min-height:300px;"></div>`;
                container.appendChild(itemDiv);
                processAndRender(config, type, `res_${index}`);
            });
        }

        function goBackToBuilder() {
            document.getElementById('reportView').style.display = 'none';
            document.getElementById('builderView').style.display = 'block';
        }
    </script>
</body>
</html>
