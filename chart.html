<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트 데이터 분석 도구</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f8fafc; padding: 30px; display: block; height: auto; overflow-y: auto; }
        .control-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; border: 1px solid #e2e8f0; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        select, input { padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; min-width: 150px; }
        .chart-main { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); min-height: 500px; position: relative; }
        .data-table-view { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table-view th, .data-table-view td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>

    <div style="max-width: 1200px; margin: 0 auto;">
        <h2 style="margin-bottom: 25px;">📊 맞춤형 데이터 리포트</h2>

        <div class="main-content" style="max-width: 1200px; margin: 0 auto; padding: 40px;">
            <h2 class="fw-bold mb-4">📈 맞춤형 데이터 분석 빌더</h2>
        
            <div class="card shadow-sm mb-4" style="background: white; border-radius: 12px; padding: 25px;">
                <h5 class="fw-bold mb-3">🛠️ 분석 프리셋 설정</h5>
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">1. 데이터 필터링 (태그/키워드)</label>
                        <input type="text" id="presetFilter" class="form-control" placeholder="예: 정품, 이벤트">
                    </div>
        
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">2. 시각화 방식</label>
                        <select id="presetViewType" class="form-select">
                            <option value="chart">📊 그래프 (Chart)</option>
                            <option value="table">📋 표 (Table)</option>
                        </select>
                    </div>
        
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">3. X축 / 행 (기준)</label>
                        <select id="presetXAxis" class="form-select">
                            <option value="monthly">📅 월별 합산 (날짜 기준)</option>
                            </select>
                    </div>
        
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">4. Y축 / 열 (값)</label>
                        <select id="presetYAxis" class="form-select">
                            </select>
                    </div>
                </div>
        
                <div class="mt-4 d-flex justify-content-end gap-2">
                    <button class="btn-select" onclick="savePreset()">💾 프리셋 저장</button>
                    <button class="btn-primary" onclick="generateAnalysis()" style="padding: 10px 40px;">🚀 생성하기</button>
                </div>
            </div>
        
            <div id="analysisResultArea" class="chart-main" style="min-height: 400px; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                <p class="text-center text-muted">설정을 완료하고 '생성하기' 버튼을 눌러주세요.</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let rawData = [];
        let mainChart = null;

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const tName = params.get('table');
            
            // 1. 테이블 설정(열 이름) 및 데이터 로드
            const { data: config } = await _supabase.from('data_config').select('columns_layout').eq('project_key', tName).maybeSingle();
            const { data: rows } = await _supabase.from('data_rows').select('*').eq('project_key', tName);
            
            rawData = rows || [];
            const layout = config?.columns_layout || [];

            // 2. 셀렉트 박스 옵션 채우기
            const xSelect = document.getElementById('selectX');
            const ySelect = document.getElementById('selectY');

            layout.filter(c => c.isVisible).forEach(col => {
                const opt = `<option value="col${col.id}_val">${col.customName || col.defaultName}</option>`;
                xSelect.innerHTML += opt;
                ySelect.innerHTML += opt;
            });

            updateAnalysis();
        }

        function updateAnalysis() {
            const xField = document.getElementById('selectX').value;
            const yField = document.getElementById('selectY').value;
            const tagKeyword = document.getElementById('filterTag').value.trim();
            const viewType = document.getElementById('selectType').value;

            // [2] 데이터 필터링
            let filtered = rawData;
            if (tagKeyword) {
                filtered = rawData.filter(r => (r.col6_val || '').includes(tagKeyword)); // 태그열 기준
            }

            // [2-1] 그룹화 로직 (월별 또는 일반 열)
            const groupedData = {};
            filtered.forEach(item => {
                let key = item[xField] || '미지정';
                if (xField === 'monthly') {
                    const dateVal = item.col1_val || ''; // 날짜열 기준
                    key = dateVal.substring(0, 7) || '날짜없음'; // "YYYY.MM" 추출
                }
                groupedData[key] = (groupedData[key] || 0) + 1;
            });

            // [3] 시각화 처리
            const canvas = document.getElementById('mainChart');
            const tableView = document.getElementById('tableView');

            if (viewType === 'table') {
                canvas.style.display = 'none';
                tableView.style.display = 'block';
                renderTable(groupedData);
            } else {
                canvas.style.display = 'block';
                tableView.style.display = 'none';
                renderChart(groupedData, viewType);
            }
        }

        function renderChart(data, type) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (mainChart) mainChart.destroy();

            mainChart = new Chart(ctx, {
                type: type,
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        label: '수량',
                        data: Object.values(data),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: type === 'pie' ? 'right' : 'top' } }
                }
            });
        }

        function renderTable(data) {
            let html = `<table class="data-table-view"><thead><tr><th>구분</th><th>수량(건)</th></tr></thead><tbody>`;
            Object.entries(data).forEach(([key, val]) => {
                html += `<tr><td>${key}</td><td>${val}</td></tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('tableView').innerHTML = html;
        }

        init();
    </script>
</body>
</html>
