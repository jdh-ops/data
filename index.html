<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 게이트웨이</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
<body>

    <div class="login-container">
        <h1>PROJECT GATEWAY</h1>
        <input type="text" id="keywordInput" placeholder="키워드를 입력하세요" onkeypress="if(event.keyCode==13) checkKeyword()">
        <button id="loginBtn" onclick="checkKeyword()">접속하기</button>

        <div style="margin-top: 15px; text-align: center;">
            <p id="message" style="margin-bottom: 8px; font-size: 14px; min-height: 20px;"></p>
            <button id="create-btn" onclick="openCreateModal()" style="display: none; padding: 6px 12px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">
                🛠️ 새 키워드로 생성하기
            </button>
        </div>
    </div>

    <div id="createModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:30px; border-radius:12px; width:350px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-top:0;">🆕 새 키워드 생성</h3>
            <input type="text" id="newKeyword" placeholder="생성할 키워드명" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
            <input type="password" id="adminPw" placeholder="관리자 비밀번호" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
            <div style="display:flex; gap:10px;">
                <button onclick="processCreate()" style="flex:2; padding:12px; background:#2ecc71; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">생성</button>
                <button onclick="closeCreateModal()" style="flex:1; padding:12px; background:#f1f1f1; color:#666; border:none; border-radius:6px; cursor:pointer;">취소</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="gateway-logic.js"></script>
</body>
</html>
