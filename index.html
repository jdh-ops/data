<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리 시스템 - 게 트웨이</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 30px; letter-spacing: 1px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        #loginBtn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        #loginBtn:hover { background: #2980b9; }
        #loginBtn:disabled { background: #bdc3c7; cursor: not-allowed; }
        #message { min-height: 20px; margin: 15px 0; font-size: 14px; font-weight: bold; }
        #create-btn { display: none; padding: 8px 15px; background: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>Wegofair 데이터</h1>
        
        <div id="beforeLogin">
            <button onclick="signInWithGoogle()" 
                    style="width: 100%; padding: 12px; background: white; border: 1px solid #cbd5e0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; margin-bottom: 10px;">
                <img src="https://www.google.com/favicon.ico" width="18">
                Wegofair 계정으로 로그인
            </button>
            <p style="font-size: 12px; color: #718096;">접속을 위해 회사 계정 로그인이 필요합니다.</p>
        </div>
    
        <div id="afterLogin" style="display: none;">

            <input type="text" id="keywordInput" placeholder="키워드를 입력하세요" onkeypress="if(event.keyCode==13) checkKeyword()">
            <button id="loginBtn" onclick="checkKeyword()">접속하기</button>

            <div style="background: #f8fafc; padding: 10px; border-radius: 8px; margin-top: 20px; border: 1px solid #e2e8f0;">
                <p id="userEmailDisplay" style="margin: 0; font-size: 13px; font-weight: bold; color: #2d3748;"></p>
                <span style="font-size: 11px; color: #48bb78;">인증 완료</span>
            </div>
            
        </div>
    
        <div style="text-align: center;">
            <p id="message"></p>
            <button id="create-btn" onclick="openCreateModal()">🛠️ 새 키워드 생성하기</button>
        </div>
    </div>

    <div id="createModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:30px; border-radius:12px; width:380px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-top:0;">🆕 새 키워드 생성</h3>
            
            <div style="margin-bottom:15px; text-align:left;">
                <label style="font-size:12px; color:#666; font-weight:bold;">접속 키워드 (입력한 값)</label>
                <input type="text" id="newKeyword" readonly style="background:#f8f9fa; color:#95a5a6; cursor:not-allowed;">
            </div>
    
            <div style="margin-bottom:15px; text-align:left;">
                <label style="font-size:12px; color:#666; font-weight:bold;">영문 닉네임 (데이터 구분용)</label>
                <input type="text" id="englishNickname" placeholder="예: my_project (공백없이 영문/숫자)">
            </div>
    
            <div style="margin-bottom:20px; text-align:left;">
                <label style="font-size:12px; color:#666; font-weight:bold;">관리자 비밀번호</label>
                <input type="password" id="adminPw" placeholder="관리자 비밀번호 입력">
            </div>
    
            <div style="display:flex; gap:10px;">
                <button onclick="processCreate()" style="flex:2; padding:12px; background:#2ecc71; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">생성하기</button>
                <button onclick="closeCreateModal()" style="flex:1; padding:12px; background:#f1f1f1; color:#666; border:none; border-radius:8px; cursor:pointer;">취소</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="gateway-logic.js"></script>

    <script>    
        // 구글 로그인 실행 함수
        async function signInWithGoogle() {
            // 1. 현재 접속 중인 환경에 따라 리다이렉트 주소 자동 설정
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            
            // 로컬이면 Go Live 주소, 아니면 GitHub Pages 주소 사용
            const redirectUrl = isLocal 
                ? window.location.origin + '/index.html' 
                : 'https://jdh-ops.github.io/data/index.html';

            const { data, error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    queryParams: {
                        prompt: 'select_account',
                        access_type: 'offline'
                    },
                    redirectTo: redirectUrl
                }
            });

            if (error) {
                const msg = document.getElementById('errorMsg');
                msg.innerText = "로그인 오류: " + error.message;
                msg.style.display = 'block';
            }
        }

        // 이미 로그인된 상태인지 확인 (자동 로그인 방지 및 리다이렉트)
        window.onload = async () => {
            // 세션 변화를 감지하여 UI를 업데이트합니다.
            _supabase.auth.onAuthStateChange(async (event, session) => {
                const beforeLogin = document.getElementById('beforeLogin');
                const afterLogin = document.getElementById('afterLogin');
                const userEmailDisplay = document.getElementById('userEmailDisplay');

                if (session && session.user) {
                    const email = session.user.email || "";

                    if (email.endsWith("@wegofair.com")) {
                        // 1. 도메인 일치 시 UI 전환
                        beforeLogin.style.display = 'none';
                        afterLogin.style.display = 'block';
                        userEmailDisplay.innerText = email;
                        
                        console.log("인증 성공:", email);
                    } else {
                        // 2. 도메인 불일치 시 로그아웃
                        alert("Wegofair 계정만 접근 가능합니다.");
                        await _supabase.auth.signOut();
                        window.location.href = 'index.html';
                    }
                } else {
                    // 3. 로그아웃 상태일 때
                    beforeLogin.style.display = 'block';
                    afterLogin.style.display = 'none';
                }
            });
        };
    </script>

</body>
</html>
